name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: mokasolar-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          command_timeout: 45m
          script: |
            set -eu

            timestamp="$(date +%Y%m%d-%H%M%S)"
            backup_root="$HOME/moka-solar-backups/$timestamp"
            mkdir -p "$backup_root"

            print_section() {
              echo
              echo "===== $1 ====="
            }

            backup_file() {
              file_path="$1"
              if [ -f "$file_path" ]; then
                dest_dir="$backup_root$(dirname "$file_path")"
                mkdir -p "$dest_dir"
                cp "$file_path" "$dest_dir/"
              fi
            }

            SUDO=""
            if command -v sudo >/dev/null 2>&1; then
              SUDO="sudo"
            fi

            print_section "Host diagnostics"
            date
            uname -a || true
            uptime || true
            df -h || true
            df -i || true
            free -m || true
            swapon --show || true
            ($SUDO journalctl -k -n 200 --no-pager | grep -iE 'oom|killed process|out of memory' || true)

            print_section "Current listeners"
            (ss -ltnp 2>/dev/null | grep -E ':(3000|4000)\s' || true)

            print_section "Current services"
            (docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true)
            (pm2 status || true)
            ($SUDO systemctl status docker --no-pager -l || true)
            ($SUDO systemctl status nginx --no-pager -l || true)

            print_section "Nginx logs"
            ($SUDO tail -n 60 /var/log/nginx/error.log | grep -iE 'connect\(|upstream|error|failed' || true)
            ($SUDO tail -n 20 /var/log/nginx/access.log || true)

            stack_mode=""
            project_dir=""
            compose_file=""
            ecosystem_file=""

            if command -v docker >/dev/null 2>&1; then
              if docker ps -a --format '{{.Names}}' | grep -qx 'moka_solar_backend'; then
                inspect_dir="$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' moka_solar_backend 2>/dev/null || true)"
                if [ -n "$inspect_dir" ] && [ -d "$inspect_dir" ] && [ -f "$inspect_dir/docker-compose.prod.yml" ]; then
                  stack_mode="docker"
                  project_dir="$inspect_dir"
                  compose_file="$inspect_dir/docker-compose.prod.yml"
                fi
              fi
            fi

            if [ -z "$stack_mode" ]; then
              compose_candidate="$(find "$HOME" /opt /srv /var/www -maxdepth 6 -type f -name 'docker-compose.prod.yml' 2>/dev/null | grep 'moka-solar-platform' | head -n 1 || true)"
              if [ -z "$compose_candidate" ]; then
                compose_candidate="$(find "$HOME" /opt /srv /var/www -maxdepth 6 -type f -name 'docker-compose.prod.yml' 2>/dev/null | head -n 1 || true)"
              fi
              if [ -n "$compose_candidate" ]; then
                stack_mode="docker"
                project_dir="$(dirname "$compose_candidate")"
                compose_file="$compose_candidate"
              fi
            fi

            if [ -z "$stack_mode" ] && command -v pm2 >/dev/null 2>&1; then
              ecosystem_candidate="$(find "$HOME" /opt /srv /var/www -maxdepth 6 -type f -name 'ecosystem.config.js' 2>/dev/null | grep 'moka-solar-platform' | head -n 1 || true)"
              if [ -z "$ecosystem_candidate" ]; then
                ecosystem_candidate="$(find "$HOME" /opt /srv /var/www -maxdepth 6 -type f -name 'ecosystem.config.js' 2>/dev/null | head -n 1 || true)"
              fi
              if [ -n "$ecosystem_candidate" ]; then
                stack_mode="pm2"
                project_dir="$(dirname "$ecosystem_candidate")"
                ecosystem_file="$ecosystem_candidate"
              fi
            fi

            if [ -z "$stack_mode" ] || [ -z "$project_dir" ]; then
              echo "Could not determine the active production stack"
              exit 1
            fi

            print_section "Selected production stack"
            echo "stack_mode=$stack_mode"
            echo "project_dir=$project_dir"
            [ -n "$compose_file" ] && echo "compose_file=$compose_file"
            [ -n "$ecosystem_file" ] && echo "ecosystem_file=$ecosystem_file"

            print_section "Project path checks"
            if [ -d "$project_dir" ]; then
              echo "project_dir is readable"
            else
              echo "WARN: project_dir is missing or not readable"
            fi
            if [ -n "$compose_file" ] && [ -f "$compose_file" ]; then
              echo "compose_file is readable"
            elif [ -n "$compose_file" ]; then
              echo "WARN: compose_file is missing or not readable"
            fi

            fallback_compose_candidate=""
            if [ "$stack_mode" = "docker" ]; then
              fallback_compose_candidate="$(find "$HOME" /opt /srv /var/www -maxdepth 6 -type f -name 'docker-compose.prod.yml' 2>/dev/null | grep 'moka-solar-platform' | head -n 1 || true)"
              if [ -z "$fallback_compose_candidate" ]; then
                fallback_compose_candidate="$(find "$HOME" /opt /srv /var/www -maxdepth 6 -type f -name 'docker-compose.prod.yml' 2>/dev/null | head -n 1 || true)"
              fi
              [ -n "$fallback_compose_candidate" ] && echo "fallback_compose_candidate=$fallback_compose_candidate"
            fi

            if ! cd "$project_dir" 2>/tmp/moka-project-dir.err; then
              echo "WARN: cannot enter project_dir=$project_dir"
              cat /tmp/moka-project-dir.err || true
              if [ "$stack_mode" = "docker" ] && [ -n "$fallback_compose_candidate" ]; then
                project_dir="$(dirname "$fallback_compose_candidate")"
                compose_file="$fallback_compose_candidate"
                echo "Using fallback project_dir=$project_dir"
                echo "Using fallback compose_file=$compose_file"
                cd "$project_dir"
              else
                exit 1
              fi
            fi

            cd "$project_dir"
            print_section "Project directory"
            pwd || true
            ls -la || true

            if [ -f ".env" ]; then
              backup_file "$project_dir/.env"
            fi

            if [ -d ".git" ]; then
              print_section "Git status before sync"
              git rev-parse --show-toplevel || true
              git branch --show-current || true
              git remote -v || true
              git status --short || true

              repo_dirty=0
              if git status --porcelain >/tmp/moka-git-status.txt 2>/tmp/moka-git-status.err; then
                if [ -s /tmp/moka-git-status.txt ]; then
                  repo_dirty=1
                fi
              else
                echo "WARN: git status --porcelain failed; continuing without repo cleanliness check"
                cat /tmp/moka-git-status.err || true
              fi

              if [ "$repo_dirty" -eq 1 ]; then
                git diff > "$backup_root/repo-local.diff" || true
                git diff --cached > "$backup_root/repo-staged.diff" || true
                git stash push -m "codex-production-recover-$timestamp" || true
              fi

              if ! git fetch origin main; then
                echo "WARN: git fetch origin main failed; continuing with current checkout"
              fi
              if ! git checkout main; then
                echo "WARN: git checkout main failed; continuing with current checkout"
              fi
              if ! git pull --ff-only origin main; then
                echo "WARN: git pull --ff-only origin main failed; continuing with current checkout"
              fi
              git rev-parse --short HEAD || true
            fi

            print_section "Back up production config"
            backup_file "$project_dir/docker-compose.prod.yml"
            backup_file "$project_dir/docker-compose.yml"
            backup_file "$project_dir/ecosystem.config.js"

            for file in $($SUDO grep -RIl 'mokasolar.com' /etc/nginx/sites-enabled /etc/nginx/sites-available /etc/nginx/conf.d 2>/dev/null || true); do
              [ -n "$file" ] || continue
              backup_file "$file"
            done

            print_section "Current Nginx upstream config"
            ($SUDO grep -RIn 'mokasolar.com\|proxy_pass\|frontend:3000\|backend:4000\|127\.0\.0\.1:3000\|127\.0\.0\.1:4000' /etc/nginx/sites-enabled /etc/nginx/sites-available /etc/nginx/conf.d 2>/dev/null || true)

            if [ "$stack_mode" = "docker" ]; then
              print_section "Docker compose production deploy"

              ($SUDO systemctl start docker || true)
              docker info --format 'Docker server {{.ServerVersion}}'

              if command -v pm2 >/dev/null 2>&1; then
                (pm2 describe moka-solar-backend >/dev/null 2>&1 && pm2 stop moka-solar-backend || true)
                (pm2 describe moka-solar-frontend >/dev/null 2>&1 && pm2 stop moka-solar-frontend || true)
              fi

              docker compose -f "$compose_file" config --services

              if docker ps -a --format '{{.Names}}' | grep -qx 'moka_solar_db'; then
                print_section "PostgreSQL backup"
                docker exec moka_solar_db sh -lc 'export PGPASSWORD="$POSTGRES_PASSWORD"; pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" --no-owner --format=custom' > "$backup_root/moka_solar_db.dump" || true
              fi

              docker compose -f "$compose_file" up -d db

              db_ready=0
              for _attempt in $(seq 1 40); do
                db_status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' moka_solar_db 2>/dev/null || echo missing)"
                echo "db_status=$db_status"
                if [ "$db_status" = "healthy" ] || [ "$db_status" = "running" ]; then
                  db_ready=1
                  break
                fi
                sleep 3
              done

              if [ "$db_ready" -ne 1 ]; then
                docker logs --tail 200 moka_solar_db || true
                exit 1
              fi

              docker compose -f "$compose_file" build backend frontend
              docker compose -f "$compose_file" up -d backend frontend
              docker compose -f "$compose_file" ps

              docker exec moka_solar_backend sh -lc "cd /app && npx prisma migrate deploy"

              backend_ready=0
              for _attempt in $(seq 1 50); do
                if curl -fsS http://127.0.0.1:4000/api/health >/tmp/moka-api-health.json 2>/dev/null; then
                  backend_ready=1
                  break
                fi
                sleep 3
              done

              if [ "$backend_ready" -ne 1 ]; then
                print_section "Backend failure logs"
                docker logs --tail 200 moka_solar_backend || true
                docker logs --tail 200 moka_solar_db || true
                exit 1
              fi

              frontend_ready=0
              for _attempt in $(seq 1 50); do
                if curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1; then
                  frontend_ready=1
                  break
                fi
                sleep 3
              done

              if [ "$frontend_ready" -ne 1 ]; then
                print_section "Frontend failure logs"
                docker logs --tail 200 moka_solar_frontend || true
                exit 1
              fi

              print_section "Container logs"
              docker logs --tail 80 moka_solar_db || true
              docker logs --tail 80 moka_solar_backend || true
              docker logs --tail 80 moka_solar_frontend || true
            else
              print_section "PM2 production deploy"

              if [ ! -f "$ecosystem_file" ]; then
                echo "Missing ecosystem file for PM2 deploy"
                exit 1
              fi

              cd "$project_dir/backend"
              npm install
              npx prisma generate
              npx prisma migrate deploy
              npm run build

              cd "$project_dir/frontend"
              npm install
              npm run build

              cd "$project_dir"
              pm2 startOrReload "$ecosystem_file" --update-env
              pm2 save
              pm2 status

              backend_ready=0
              for _attempt in $(seq 1 50); do
                if curl -fsS http://127.0.0.1:4000/api/health >/tmp/moka-api-health.json 2>/dev/null; then
                  backend_ready=1
                  break
                fi
                sleep 3
              done

              if [ "$backend_ready" -ne 1 ]; then
                print_section "PM2 backend logs"
                pm2 logs moka-solar-backend --lines 200 --nostream || true
                exit 1
              fi

              frontend_ready=0
              for _attempt in $(seq 1 50); do
                if curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1; then
                  frontend_ready=1
                  break
                fi
                sleep 3
              done

              if [ "$frontend_ready" -ne 1 ]; then
                print_section "PM2 frontend logs"
                pm2 logs moka-solar-frontend --lines 200 --nostream || true
                exit 1
              fi
            fi

            print_section "Normalize Nginx production upstreams"
            for file in $($SUDO grep -RIl 'mokasolar.com' /etc/nginx/sites-enabled /etc/nginx/sites-available /etc/nginx/conf.d 2>/dev/null || true); do
              [ -n "$file" ] || continue
              backup_file "$file"
              $SUDO sed -i 's|proxy_pass http://127.0.0.1:4000/;|proxy_pass http://127.0.0.1:4000;|g' "$file"
              $SUDO sed -i 's|proxy_pass http://127.0.0.1:4000/api/;|proxy_pass http://127.0.0.1:4000;|g' "$file"
              $SUDO sed -i 's|proxy_pass http://frontend:3000;|proxy_pass http://127.0.0.1:3000;|g' "$file"
              $SUDO sed -i 's|proxy_pass http://backend:4000/;|proxy_pass http://127.0.0.1:4000;|g' "$file"
              $SUDO sed -i 's|proxy_pass http://backend:4000;|proxy_pass http://127.0.0.1:4000;|g' "$file"
              $SUDO sed -i 's|set $frontend_upstream http://frontend:3000;|set $frontend_upstream http://127.0.0.1:3000;|g' "$file"
              $SUDO sed -i 's|set $backend_upstream http://backend:4000;|set $backend_upstream http://127.0.0.1:4000;|g' "$file"
            done

            python3 - <<'PY'
            from pathlib import Path

            redirect_line = "    if ($host = www.mokasolar.com) {\n        return 301 https://mokasolar.com$request_uri;\n    }\n"
            candidates = []
            for root in ("/etc/nginx/sites-enabled", "/etc/nginx/sites-available", "/etc/nginx/conf.d"):
                path = Path(root)
                if not path.exists():
                    continue
                candidates.extend([item for item in path.rglob("*") if item.is_file()])

            for file_path in candidates:
                try:
                    text = file_path.read_text()
                except Exception:
                    continue

                if "mokasolar.com" not in text:
                    continue

                if "www.mokasolar.com" in text and "return 301 https://mokasolar.com$request_uri;" in text:
                    continue

                updated = text.replace(
                    "server_name mokasolar.com www.mokasolar.com;\n",
                    "server_name mokasolar.com www.mokasolar.com;\n" + redirect_line,
                )
                updated = updated.replace(
                    "server_name www.mokasolar.com mokasolar.com;\n",
                    "server_name www.mokasolar.com mokasolar.com;\n" + redirect_line,
                )

                if updated != text:
                    file_path.write_text(updated)
            PY

            print_section "Validate and reload Nginx"
            $SUDO nginx -t
            ($SUDO systemctl reload nginx || $SUDO service nginx reload || $SUDO nginx -s reload)

            print_section "Final host checks"
            curl -fsS http://127.0.0.1:4000/api/health
            curl -I -fsS http://127.0.0.1:3000/
            curl -I -fsS http://127.0.0.1/
            curl -fsS http://127.0.0.1/api/health

            print_section "Final service state"
            (ss -ltnp 2>/dev/null | grep -E ':(3000|4000)\s' || true)
            (docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true)
            (pm2 status || true)
            ($SUDO tail -n 80 /var/log/nginx/error.log || true)
