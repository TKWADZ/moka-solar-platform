name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: mokasolar-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          command_timeout: 55m
          script: |
            set -eu
            umask 077

            timestamp="$(date +%Y%m%d-%H%M%S)"
            expected_sha="${{ github.sha }}"
            backup_root="$HOME/moka-solar-backups/$timestamp"
            mkdir -p "$backup_root"

            print_section() {
              echo
              echo "===== $1 ====="
            }

            backup_file() {
              file_path="$1"
              if [ -f "$file_path" ] || [ -L "$file_path" ]; then
                dest_dir="$backup_root$(dirname "$file_path")"
                mkdir -p "$dest_dir"
                cp -a "$file_path" "$dest_dir/"
              fi
            }

            SUDO=""
            if command -v sudo >/dev/null 2>&1; then
              SUDO="sudo"
            fi

            sync_checkout_to_expected() {
              checkout_dir="$1"
              checkout_label="$2"

              if [ ! -d "$checkout_dir/.git" ]; then
                echo "Missing git checkout for $checkout_label at $checkout_dir"
                exit 1
              fi

              print_section "Sync checkout: $checkout_label"
              cd "$checkout_dir"

              status_file="/tmp/${checkout_label}.status"
              if ! git status --porcelain >"$status_file" 2>"$status_file.err"; then
                echo "Unable to inspect git status for $checkout_label"
                exit 1
              fi

              if [ -s "$status_file" ]; then
                git diff > "$backup_root/${checkout_label}.diff" || true
                git diff --cached > "$backup_root/${checkout_label}.staged.diff" || true
                git stash push -m "codex-${checkout_label}-${timestamp}" || true
              fi

              git fetch --no-tags origin main
              git checkout main
              git rev-parse --verify "$expected_sha^{commit}" >/dev/null
              git merge --ff-only "$expected_sha"

              deployed_sha="$(git rev-parse HEAD)"
              if [ "$deployed_sha" != "$expected_sha" ]; then
                echo "Checkout $checkout_label is not on the triggering commit"
                exit 1
              fi
            }

            run_pm2_deploy() {
              print_section "PM2 production deploy"

              if [ ! -f "$ecosystem_file" ]; then
                echo "Missing PM2 ecosystem file at $ecosystem_file"
                exit 1
              fi

              sync_checkout_to_expected "$project_dir" "mokasolar-canonical"

              cd "$project_dir/backend"
              npm install
              npx prisma generate
              npx prisma migrate deploy
              npm run build

              cd "$project_dir/frontend"
              npm install
              npm run build

              cd "$project_dir"
              pm2 startOrReload "$ecosystem_file" --update-env

              if ! command -v systemctl >/dev/null 2>&1; then
                echo "systemd is required to persist PM2 after reboot"
                exit 1
              fi

              pm2_user="$(id -un)"
              pm2_home="$HOME"
              pm2_bin="$(command -v pm2)"
              pm2_service="pm2-$pm2_user"

              $SUDO env PATH="$PATH" "$pm2_bin" startup systemd -u "$pm2_user" --hp "$pm2_home"
              pm2 save
              $SUDO systemctl enable "$pm2_service"
              $SUDO systemctl is-enabled --quiet "$pm2_service"
              $SUDO systemctl cat "$pm2_service" | grep -F 'pm2 resurrect' >/dev/null

              backend_ready=0
              for _attempt in $(seq 1 50); do
                if curl -fsS http://127.0.0.1:4000/api/health >/tmp/mokasolar-api-health.json 2>/dev/null; then
                  backend_ready=1
                  break
                fi
                sleep 3
              done

              if [ "$backend_ready" -ne 1 ]; then
                print_section "PM2 backend logs"
                pm2 logs moka-solar-backend --lines 200 --nostream || true
                exit 1
              fi

              frontend_ready=0
              for _attempt in $(seq 1 50); do
                if curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1; then
                  frontend_ready=1
                  break
                fi
                sleep 3
              done

              if [ "$frontend_ready" -ne 1 ]; then
                print_section "PM2 frontend logs"
                pm2 logs moka-solar-frontend --lines 200 --nostream || true
                exit 1
              fi
            }

            run_docker_deploy() {
              print_section "Docker compose production deploy"

              docker_available=1
              docker_run() {
                docker "$@"
              }

              ($SUDO systemctl start docker || $SUDO service docker start || $SUDO snap start docker || true)

              if ! docker version >/dev/null 2>&1; then
                if [ -n "$SUDO" ] && $SUDO docker version >/dev/null 2>&1; then
                  docker_run() {
                    $SUDO docker "$@"
                  }
                else
                  docker_available=0
                fi
              fi

              if [ "$docker_available" -ne 1 ]; then
                echo "Docker CLI or daemon is unavailable"
                exit 1
              fi

              sync_checkout_to_expected "$project_dir" "mokasolar-canonical"

              if command -v pm2 >/dev/null 2>&1; then
                (pm2 describe moka-solar-backend >/dev/null 2>&1 && pm2 stop moka-solar-backend || true)
                (pm2 describe moka-solar-frontend >/dev/null 2>&1 && pm2 stop moka-solar-frontend || true)
              fi

              docker_compose_args="-f $compose_file"
              if [ -n "${compose_project_name:-}" ]; then
                docker_compose_args="-p $compose_project_name $docker_compose_args"
              fi

              docker_run compose $docker_compose_args config --services

              if docker_run ps -a --format '{{.Names}}' | grep -qx 'moka_solar_db'; then
                print_section "PostgreSQL backup"
                docker_run exec moka_solar_db sh -lc 'export PGPASSWORD="$POSTGRES_PASSWORD"; pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" --no-owner --format=custom' > "$backup_root/moka_solar_db.dump" || true
              fi

              docker_run compose $docker_compose_args up -d db

              db_ready=0
              for _attempt in $(seq 1 40); do
                db_status="$(docker_run inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' moka_solar_db 2>/dev/null || echo missing)"
                echo "db_status=$db_status"
                if [ "$db_status" = "healthy" ] || [ "$db_status" = "running" ]; then
                  db_ready=1
                  break
                fi
                sleep 3
              done

              if [ "$db_ready" -ne 1 ]; then
                docker_run logs --tail 200 moka_solar_db || true
                exit 1
              fi

              docker_run compose $docker_compose_args build backend frontend
              docker_run compose $docker_compose_args up -d backend frontend
              docker_run compose $docker_compose_args ps
              docker_run exec moka_solar_backend sh -lc "cd /app && npx prisma migrate deploy"

              backend_ready=0
              for _attempt in $(seq 1 50); do
                if curl -fsS http://127.0.0.1:4000/api/health >/tmp/mokasolar-api-health.json 2>/dev/null; then
                  backend_ready=1
                  break
                fi
                sleep 3
              done

              if [ "$backend_ready" -ne 1 ]; then
                print_section "Docker backend logs"
                docker_run logs --tail 200 moka_solar_backend || true
                docker_run logs --tail 200 moka_solar_db || true
                exit 1
              fi

              frontend_ready=0
              for _attempt in $(seq 1 50); do
                if curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1; then
                  frontend_ready=1
                  break
                fi
                sleep 3
              done

              if [ "$frontend_ready" -ne 1 ]; then
                print_section "Docker frontend logs"
                docker_run logs --tail 200 moka_solar_frontend || true
                exit 1
              fi
            }

            print_section "Host diagnostics"
            pwd
            date
            uname -a || true
            uptime || true
            df -h || true
            df -i || true
            free -h || true
            swapon --show || true
            ($SUDO journalctl -k -n 200 --no-pager | grep -iE 'oom|killed process|out of memory' || true)

            print_section "Current listeners"
            ($SUDO ss -ltnp || ss -ltnp || true)

            print_section "PM2 state"
            (pm2 status || true)
            (pm2 prettylist || true)

            print_section "Service state"
            ($SUDO systemctl status "pm2-$(id -un)" --no-pager -l || true)
            ($SUDO systemctl status pm2-root --no-pager -l || true)
            ($SUDO systemctl status docker --no-pager -l || true)
            ($SUDO systemctl status nginx --no-pager -l || true)
            ($SUDO systemctl status postgresql --no-pager -l || true)

            print_section "Nginx logs and config"
            ($SUDO tail -n 60 /var/log/nginx/error.log || true)
            ($SUDO tail -n 20 /var/log/nginx/access.log || true)
            ($SUDO nginx -T || true)

            stack_mode=""
            project_dir=""
            compose_file=""
            ecosystem_file=""
            compose_project_name=""

            if command -v docker >/dev/null 2>&1; then
              if docker ps -a --format '{{.Names}}' | grep -qx 'moka_solar_backend'; then
                inspect_dir="$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' moka_solar_backend 2>/dev/null || true)"
                compose_project_name="$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' moka_solar_backend 2>/dev/null || true)"
                if [ -n "$inspect_dir" ] && [ -d "$inspect_dir" ] && [ -f "$inspect_dir/docker-compose.prod.yml" ]; then
                  stack_mode="docker"
                  project_dir="$inspect_dir"
                  compose_file="$inspect_dir/docker-compose.prod.yml"
                fi
              fi
            fi

            if [ -z "$stack_mode" ]; then
              compose_candidate="$(find "$HOME" /opt /srv /var/www -maxdepth 6 -type f -name 'docker-compose.prod.yml' ! -path "$HOME/moka-solar-backups/*" 2>/dev/null | grep 'moka-solar-platform' | head -n 1 || true)"
              if [ -z "$compose_candidate" ]; then
                compose_candidate="$(find "$HOME" /opt /srv /var/www -maxdepth 6 -type f -name 'docker-compose.prod.yml' ! -path "$HOME/moka-solar-backups/*" 2>/dev/null | head -n 1 || true)"
              fi
              if [ -n "$compose_candidate" ]; then
                stack_mode="docker"
                project_dir="$(dirname "$compose_candidate")"
                compose_file="$compose_candidate"
              fi
            fi

            if [ -z "$stack_mode" ] && command -v pm2 >/dev/null 2>&1; then
              ecosystem_candidate="$(find "$HOME" /opt /srv /var/www -maxdepth 6 -type f -name 'ecosystem.config.js' ! -path "$HOME/moka-solar-backups/*" 2>/dev/null | grep 'moka-solar-platform' | head -n 1 || true)"
              if [ -z "$ecosystem_candidate" ]; then
                ecosystem_candidate="$(find "$HOME" /opt /srv /var/www -maxdepth 6 -type f -name 'ecosystem.config.js' ! -path "$HOME/moka-solar-backups/*" 2>/dev/null | head -n 1 || true)"
              fi
              if [ -n "$ecosystem_candidate" ]; then
                stack_mode="pm2"
                project_dir="$(dirname "$ecosystem_candidate")"
                ecosystem_file="$ecosystem_candidate"
              fi
            fi

            if [ -z "$stack_mode" ] || [ -z "$project_dir" ]; then
              echo "Could not determine the active production stack"
              exit 1
            fi

            print_section "Selected production stack"
            echo "stack_mode=$stack_mode"
            echo "project_dir=$project_dir"
            if [ -n "$compose_file" ]; then
              echo "compose_file=$compose_file"
            fi
            if [ -n "$ecosystem_file" ]; then
              echo "ecosystem_file=$ecosystem_file"
            fi
            if [ -n "$compose_project_name" ]; then
              echo "compose_project_name=$compose_project_name"
            fi

            print_section "Project path checks"
            git -C "$project_dir" status --short --branch || true
            ls -la "$project_dir" || true

            if [ -f "$project_dir/.env" ]; then
              backup_file "$project_dir/.env"
            fi
            if [ -f "$project_dir/backend/.env" ]; then
              backup_file "$project_dir/backend/.env"
            fi
            if [ -f "$project_dir/frontend/.env" ]; then
              backup_file "$project_dir/frontend/.env"
            fi

            if [ -d "$project_dir/.git" ]; then
              sync_checkout_to_expected "$project_dir" "mokasolar-current"
            fi

            if [ ! -f "$project_dir/deploy/scripts/prepare-multisite-vps.sh" ]; then
              echo "Missing multisite preparation script in $project_dir"
              exit 1
            fi

            print_section "Prepare multi-site VPS layout"
            bash "$project_dir/deploy/scripts/prepare-multisite-vps.sh" "$project_dir" "$backup_root" "$stack_mode"

            if [ ! -f "$backup_root/multisite-state.env" ]; then
              echo "Multisite state file was not created"
              exit 1
            fi

            # shellcheck disable=SC1090
            . "$backup_root/multisite-state.env"

            project_dir="$PROJECT_DIR"
            stack_mode="$STACK_MODE"
            compose_file="${COMPOSE_FILE:-$project_dir/docker-compose.prod.yml}"
            ecosystem_file="${ECOSYSTEM_FILE:-$project_dir/ecosystem.config.js}"

            print_section "Canonical deployment state"
            echo "stack_mode=$stack_mode"
            echo "project_dir=$project_dir"
            echo "compose_file=$compose_file"
            echo "ecosystem_file=$ecosystem_file"
            echo "legacy_project_dir=${LEGACY_PROJECT_DIR:-}"
            echo "postgres_mode=${POSTGRES_MODE:-unknown}"
            echo "active_moka_nginx=${ACTIVE_MOKA_NGINX:-}"
            echo "canonical_moka_nginx=${CANONICAL_MOKA_NGINX:-}"
            echo "web_moi_nginx=${WEB_MOI_NGINX:-}"

            print_section "Back up canonical production config"
            backup_file "$project_dir/docker-compose.prod.yml"
            backup_file "$project_dir/docker-compose.yml"
            backup_file "$project_dir/ecosystem.config.js"
            backup_file "$ecosystem_file"
            for file in $($SUDO grep -RIl 'mokasolar.com' /etc/nginx/sites-enabled /etc/nginx/sites-available /etc/nginx/conf.d 2>/dev/null || true); do
              [ -n "$file" ] || continue
              backup_file "$file"
            done

            if [ "$stack_mode" = "docker" ]; then
              run_docker_deploy
            else
              run_pm2_deploy
            fi

            print_section "Normalize Nginx production upstreams"
            for file in $($SUDO grep -RIl 'mokasolar.com' /etc/nginx/sites-enabled /etc/nginx/sites-available /etc/nginx/conf.d 2>/dev/null || true); do
              [ -n "$file" ] || continue
              backup_file "$file"
              $SUDO sed -i 's|proxy_pass http://127.0.0.1:4000/;|proxy_pass http://127.0.0.1:4000;|g' "$file"
              $SUDO sed -i 's|proxy_pass http://127.0.0.1:4000/api/;|proxy_pass http://127.0.0.1:4000;|g' "$file"
              $SUDO sed -i 's|proxy_pass http://frontend:3000;|proxy_pass http://127.0.0.1:3000;|g' "$file"
              $SUDO sed -i 's|proxy_pass http://backend:4000/;|proxy_pass http://127.0.0.1:4000;|g' "$file"
              $SUDO sed -i 's|proxy_pass http://backend:4000;|proxy_pass http://127.0.0.1:4000;|g' "$file"
              $SUDO sed -i 's|set $frontend_upstream http://frontend:3000;|set $frontend_upstream http://127.0.0.1:3000;|g' "$file"
              $SUDO sed -i 's|set $backend_upstream http://backend:4000;|set $backend_upstream http://127.0.0.1:4000;|g' "$file"
            done

            print_section "Validate and reload Nginx"
            $SUDO nginx -t
            ($SUDO systemctl reload nginx || $SUDO service nginx reload || $SUDO nginx -s reload)

            print_section "Final local host checks"
            curl -fsS http://127.0.0.1:4000/api/health
            curl -I -fsS http://127.0.0.1:3000/
            curl -I -fsS -H 'Host: mokasolar.com' http://127.0.0.1/
            curl -fsS -H 'Host: mokasolar.com' http://127.0.0.1/api/health

            print_section "Observe production for 5 minutes"
            for observation in $(seq 1 10); do
              sleep 30
              echo "observation=$observation"
              curl -fsS http://127.0.0.1:4000/api/health >/tmp/mokasolar-api-health.json
              curl -fsS http://127.0.0.1:3000/ >/dev/null
              curl -fsS -H 'Host: mokasolar.com' http://127.0.0.1/api/health >/dev/null
              (pm2 status || true)
              (docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true)
            done

            print_section "Final service state"
            ($SUDO ss -ltnp || ss -ltnp || true)
            (docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true)
            (pm2 status || true)
            ($SUDO tail -n 80 /var/log/nginx/error.log || true)

      - name: Verify public production endpoints
        shell: bash
        run: |
          set -euo pipefail

          root_status="$(curl -s -o /dev/null -w '%{http_code}' https://mokasolar.com/)"
          [ "$root_status" = "200" ]

          curl --fail --silent --show-error \
            --retry 5 --retry-delay 3 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            https://mokasolar.com/about >/dev/null

          curl --fail --silent --show-error \
            --retry 5 --retry-delay 3 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            https://mokasolar.com/privacy >/dev/null

          curl --fail --silent --show-error \
            --retry 5 --retry-delay 3 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            https://mokasolar.com/robots.txt >/dev/null

          homepage="$(
            curl --fail --silent --show-error \
              --retry 5 --retry-delay 3 --retry-all-errors \
              --connect-timeout 10 --max-time 30 \
              https://mokasolar.com/
          )"

          asset_path="$(printf '%s' "$homepage" | grep -oE '/_next/[^"'"'"' ]+\.(js|css)' | head -n 1 || true)"
          if [ -n "$asset_path" ]; then
            curl --fail --silent --show-error \
              --retry 5 --retry-delay 3 --retry-all-errors \
              --connect-timeout 10 --max-time 30 \
              "https://mokasolar.com$asset_path" >/dev/null
          fi

          http_status="$(curl -s -o /dev/null -w '%{http_code}' http://mokasolar.com/)"
          case "$http_status" in
            301|302|307|308) ;;
            *)
              echo "Unexpected HTTP redirect status: $http_status"
              exit 1
              ;;
          esac

          www_headers="$(curl -sI https://www.mokasolar.com/ | tr -d '\r')"
          printf '%s' "$www_headers" | grep -iq '^location: https://mokasolar.com'

          health="$(
            curl --fail --silent --show-error \
              --retry 5 --retry-delay 3 --retry-all-errors \
              --connect-timeout 10 --max-time 30 \
              https://mokasolar.com/api/health
          )"

          jq -e '.status == "ok" and .database == "up"' <<<"$health" >/dev/null
