services:
  db:
    image: postgres:16
    container_name: moka_solar_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - moka_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: moka_solar_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://mokasolar.com}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      STAFF_PASSWORD_RECOVERY_EMAIL_ENABLED: ${STAFF_PASSWORD_RECOVERY_EMAIL_ENABLED:-false}
      STAFF_PASSWORD_RESET_TTL_MINUTES: ${STAFF_PASSWORD_RESET_TTL_MINUTES:-20}
      STAFF_PASSWORD_RESET_REQUEST_MAX_PER_HOUR: ${STAFF_PASSWORD_RESET_REQUEST_MAX_PER_HOUR:-5}
      STAFF_PASSWORD_RESET_SUBMIT_MAX_PER_HOUR: ${STAFF_PASSWORD_RESET_SUBMIT_MAX_PER_HOUR:-10}
      AUTH_OTP_TTL_MINUTES: ${AUTH_OTP_TTL_MINUTES:-5}
      AUTH_OTP_MAX_ATTEMPTS: ${AUTH_OTP_MAX_ATTEMPTS:-5}
      AUTH_OTP_DEBUG_MODE: ${AUTH_OTP_DEBUG_MODE:-false}
      AUTH_OTP_RESEND_COOLDOWN_SECONDS: ${AUTH_OTP_RESEND_COOLDOWN_SECONDS:-60}
      AUTH_OTP_RATE_LIMIT_PHONE_WINDOW_MINUTES: ${AUTH_OTP_RATE_LIMIT_PHONE_WINDOW_MINUTES:-15}
      AUTH_OTP_RATE_LIMIT_PHONE_MAX: ${AUTH_OTP_RATE_LIMIT_PHONE_MAX:-5}
      AUTH_OTP_RATE_LIMIT_IP_WINDOW_MINUTES: ${AUTH_OTP_RATE_LIMIT_IP_WINDOW_MINUTES:-15}
      AUTH_OTP_RATE_LIMIT_IP_MAX: ${AUTH_OTP_RATE_LIMIT_IP_MAX:-20}
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      ENABLE_CUSTOMER_MOCK_PAYMENT: ${ENABLE_CUSTOMER_MOCK_PAYMENT:-false}
      ENABLE_ENERGY_MOCK_SYNC: ${ENABLE_ENERGY_MOCK_SYNC:-false}
      BOOTSTRAP_SUPERADMIN_EMAIL: ${BOOTSTRAP_SUPERADMIN_EMAIL:-}
      BOOTSTRAP_SUPERADMIN_NAME: ${BOOTSTRAP_SUPERADMIN_NAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
      SEMS_LOGIN_URL: ${SEMS_LOGIN_URL:-}
      SEMS_ACCOUNT: ${SEMS_ACCOUNT:-}
      SEMS_PASSWORD: ${SEMS_PASSWORD:-}
      SOLARMAN_BASE_URL: ${SOLARMAN_BASE_URL:-}
      SOLARMAN_APP_ID: ${SOLARMAN_APP_ID:-}
      SOLARMAN_APP_SECRET: ${SOLARMAN_APP_SECRET:-}
      SOLARMAN_USERNAME: ${SOLARMAN_USERNAME:-}
      SOLARMAN_PASSWORD: ${SOLARMAN_PASSWORD:-}
      SOLARMAN_STATION_ID: ${SOLARMAN_STATION_ID:-}
      SOLARMAN_MONTHLY_ENDPOINTS: ${SOLARMAN_MONTHLY_ENDPOINTS:-}
      SOLARMAN_PREFERRED_MODE: ${SOLARMAN_PREFERRED_MODE:-auto}
      SOLARMAN_WEB_LOGIN_URL: ${SOLARMAN_WEB_LOGIN_URL:-}
      SOLARMAN_WEB_STATION_LIST_URL: ${SOLARMAN_WEB_STATION_LIST_URL:-}
      SOLARMAN_WEB_MONTHLY_URL: ${SOLARMAN_WEB_MONTHLY_URL:-}
      SOLARMAN_WEB_MONTHLY_ENDPOINTS: ${SOLARMAN_WEB_MONTHLY_ENDPOINTS:-}
      SOLARMAN_WEB_ORIGIN: ${SOLARMAN_WEB_ORIGIN:-}
      SOLARMAN_WEB_REFERER: ${SOLARMAN_WEB_REFERER:-}
      SOLARMAN_WEB_EXTRA_HEADERS: ${SOLARMAN_WEB_EXTRA_HEADERS:-{}}
      SOLARMAN_SYNC_INTERVAL_MINUTES: ${SOLARMAN_SYNC_INTERVAL_MINUTES:-0}
      SOLARMAN_SETTINGS_SECRET: ${SOLARMAN_SETTINGS_SECRET:-}
      DEYE_SETTINGS_SECRET: ${DEYE_SETTINGS_SECRET:-}
      DEYE_SYNC_INTERVAL_MINUTES: ${DEYE_SYNC_INTERVAL_MINUTES:-0}
      MONITOR_SYNC_TIMEZONE: ${MONITOR_SYNC_TIMEZONE:-Asia/Ho_Chi_Minh}
      BILLING_TIMEZONE: ${BILLING_TIMEZONE:-Asia/Ho_Chi_Minh}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      AI_SETTINGS_SECRET: ${AI_SETTINGS_SECRET:-}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-20000}
      MEDIA_STORAGE_DIR: ${MEDIA_STORAGE_DIR:-storage/media}
      ZALO_DRY_RUN: ${ZALO_DRY_RUN:-true}
      ZALO_SETTINGS_SECRET: ${ZALO_SETTINGS_SECRET:-}
      ZALO_AUTOMATION_ENABLED: ${ZALO_AUTOMATION_ENABLED:-false}
      ZALO_AUTOMATION_CRON: ${ZALO_AUTOMATION_CRON:-0 */15 * * * *}
      ZALO_AUTOMATION_TIMEZONE: ${ZALO_AUTOMATION_TIMEZONE:-Asia/Ho_Chi_Minh}
      ZALO_AUTOMATION_BATCH_SIZE: ${ZALO_AUTOMATION_BATCH_SIZE:-50}
      ZALO_INVOICE_LOOKBACK_DAYS: ${ZALO_INVOICE_LOOKBACK_DAYS:-60}
      ZALO_REMINDER_DAYS_BEFORE_DUE: ${ZALO_REMINDER_DAYS_BEFORE_DUE:-3}
      ZALO_REMINDER_COOLDOWN_HOURS: ${ZALO_REMINDER_COOLDOWN_HOURS:-72}
      ZALO_RETRY_COOLDOWN_HOURS: ${ZALO_RETRY_COOLDOWN_HOURS:-6}
      ZALO_PAID_LOOKBACK_DAYS: ${ZALO_PAID_LOOKBACK_DAYS:-30}
    ports:
      - "${BACKEND_PORT}:4000"
    volumes:
      - ./backend/storage:/app/storage
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_ENABLE_DEMO_FALLBACK: ${NEXT_PUBLIC_ENABLE_DEMO_FALLBACK:-false}
        NEXT_PUBLIC_ENABLE_CUSTOMER_MOCK_PAYMENT: ${NEXT_PUBLIC_ENABLE_CUSTOMER_MOCK_PAYMENT:-false}
        NEXT_PUBLIC_ENABLE_SAMPLE_ACCOUNTS: ${NEXT_PUBLIC_ENABLE_SAMPLE_ACCOUNTS:-false}
        NEXT_PUBLIC_ENABLE_SELF_REGISTER: ${NEXT_PUBLIC_ENABLE_SELF_REGISTER:-false}
        NEXT_PUBLIC_SAMPLE_SUPERADMIN_EMAIL: ${NEXT_PUBLIC_SAMPLE_SUPERADMIN_EMAIL:-}
        NEXT_PUBLIC_SAMPLE_SUPERADMIN_PASSWORD: ${NEXT_PUBLIC_SAMPLE_SUPERADMIN_PASSWORD:-}
        NEXT_PUBLIC_SAMPLE_ADMIN_EMAIL: ${NEXT_PUBLIC_SAMPLE_ADMIN_EMAIL:-}
        NEXT_PUBLIC_SAMPLE_ADMIN_PASSWORD: ${NEXT_PUBLIC_SAMPLE_ADMIN_PASSWORD:-}
        NEXT_PUBLIC_SAMPLE_CUSTOMER_EMAIL: ${NEXT_PUBLIC_SAMPLE_CUSTOMER_EMAIL:-}
        NEXT_PUBLIC_SAMPLE_CUSTOMER_PASSWORD: ${NEXT_PUBLIC_SAMPLE_CUSTOMER_PASSWORD:-}
    container_name: moka_solar_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NEXT_PUBLIC_ENABLE_DEMO_FALLBACK: ${NEXT_PUBLIC_ENABLE_DEMO_FALLBACK:-false}
      NEXT_PUBLIC_ENABLE_CUSTOMER_MOCK_PAYMENT: ${NEXT_PUBLIC_ENABLE_CUSTOMER_MOCK_PAYMENT:-false}
      NEXT_PUBLIC_ENABLE_SAMPLE_ACCOUNTS: ${NEXT_PUBLIC_ENABLE_SAMPLE_ACCOUNTS:-false}
      NEXT_PUBLIC_ENABLE_SELF_REGISTER: ${NEXT_PUBLIC_ENABLE_SELF_REGISTER:-false}
      NEXT_PUBLIC_SAMPLE_SUPERADMIN_EMAIL: ${NEXT_PUBLIC_SAMPLE_SUPERADMIN_EMAIL:-}
      NEXT_PUBLIC_SAMPLE_SUPERADMIN_PASSWORD: ${NEXT_PUBLIC_SAMPLE_SUPERADMIN_PASSWORD:-}
      NEXT_PUBLIC_SAMPLE_ADMIN_EMAIL: ${NEXT_PUBLIC_SAMPLE_ADMIN_EMAIL:-}
      NEXT_PUBLIC_SAMPLE_ADMIN_PASSWORD: ${NEXT_PUBLIC_SAMPLE_ADMIN_PASSWORD:-}
      NEXT_PUBLIC_SAMPLE_CUSTOMER_EMAIL: ${NEXT_PUBLIC_SAMPLE_CUSTOMER_EMAIL:-}
      NEXT_PUBLIC_SAMPLE_CUSTOMER_PASSWORD: ${NEXT_PUBLIC_SAMPLE_CUSTOMER_PASSWORD:-}
    ports:
      - "${FRONTEND_PORT}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  moka_pgdata:
